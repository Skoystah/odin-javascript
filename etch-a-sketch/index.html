<!DOCTYPE html>
<html>

<head>
    <script src="main.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="menu-container">
        <div class="menu-buttons">
            <button class="menu-button" id="new-drawing-button">New drawing</button>
            <button class="menu-button" id="reset-button">Reset</button>
        </div>

        <div class="menu-color">
            <input type="radio" id="color-choice-black-white" name="color-choice" value="black-white" checked>
            <label for="color-choice-black-white">Black/white</label>
            <input type="radio" id="color-choice-random" name="color-choice" value="random">
            <label for="color-choice-random">Random!</label>
        </div>

    </div>
    <div class="grid-container">
    </div>
</body>

</html>

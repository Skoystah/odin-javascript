<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <script src="main.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>My shopping list</h1>
    <div class="input-section">
        <form id="input-form" class="input-form">
            <label for="item-name">Enter a new item: </label>
            <input type="text" name="item-name" id="item-name">
            <button id="add-item-submit">Add item</button>
        </form>
    </div>
    <div class="item-list">
        <ul id="item-list"></ul>
    </div>
</body>

</html>
